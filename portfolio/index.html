<style>:root{

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);

  padding:.45rem 0;text-decoration:none;color:var(--text-dark);border-bottom:1px solid var(--rule)}
li:last-child a.f{border-bottom:0}
a.f:hover{color:var(--link)}
.s{color:var(--muted);font:.75rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.more{display:inline-block;margin-top:2rem;color:var(--link);text-decoration:none;font-size:.9375rem}
